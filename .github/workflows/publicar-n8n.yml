# Publica el nodo de n8n en npm CON PROVENANCE.
#
# ⚠ Desde el 1 de mayo de 2026, n8n solo verifica nodos publicados asi: con
#   GitHub Actions y una declaracion de procedencia. Publicar a mano desde un
#   portatil ya no se acepta para el catalogo verificado.
#
# La procedencia es una firma que ata el paquete publicado a ESTE repositorio
# y a ESTE flujo, de modo que quien lo instala puede comprobar de donde salio.
# Por eso hacen falta `id-token: write` y el campo `repository` del
# package.json: sin cualquiera de los dos, `--provenance` falla.
#
# Se dispara A MANO o al publicar una release, nunca en cada empujon: subir a
# npm no se deshace, y una version publicada por error se queda publicada.
name: Publicar el nodo de n8n en npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # imprescindible para la procedencia
    defaults:
      run:
        working-directory: n8n/nodo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Comprobar tipos
        run: npx tsc --noEmit

      - name: Construir
        run: npm run build

      # Que el paquete lleve DE VERDAD lo que dice llevar. Un `files` mal
      # puesto publica un paquete vacio y nadie se entera hasta que alguien
      # intenta usarlo.
      - name: Ver que entra en el paquete
        run: npm pack --dry-run

      - name: Publicar
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
