; Uttera en Asterisk — dialplan de ejemplo.
;
; Incluir desde extensions.conf:  #include "uttera.conf"
;
; Los AGI leen la clave del ENTORNO DE ASTERISK, no del dialplan: una clave en
; el dialplan acaba en el backup de la configuracion, en el control de versiones
; y en el volcado de `dialplan show`. Se pone en el servicio:
;
;   systemctl edit asterisk
;   [Service]
;   Environment=UTTERA_API_KEY=sk-echo-...
;   Environment=UTTERA_VOZ=nova

[uttera-demo]

; ── 1) Solo decir algo ──────────────────────────────────────────────────────
exten => 100,1,Answer()
 same => n,AGI(uttera-decir.agi,"Hola. Gracias por llamar a la demostracion de Uttera.")
 same => n,Hangup()

; ── 2) Preguntar, escuchar y repetir lo entendido ───────────────────────────
; El caso util de verdad: lo que diga el cliente queda en UTTERA_TEXTO y a
; partir de ahi se decide -un menu, una consulta a la base de datos, un LLM-.
exten => 101,1,Answer()
 same => n,AGI(uttera-decir.agi,"Digame en que puedo ayudarle despues de la senal.")
 ; 8 segundos de tope, corta sola tras 2 segundos de silencio
 same => n,AGI(uttera-oir.agi,8,es)
 same => n,NoOp(El cliente dijo: ${UTTERA_TEXTO})
 same => n,GotoIf($["${UTTERA_TEXTO}" = ""]?nada)
 same => n,AGI(uttera-decir.agi,"He entendido: ${UTTERA_TEXTO}")
 same => n,Hangup()
 same => n(nada),AGI(uttera-decir.agi,"No he oido nada. Hasta luego.")
 same => n,Hangup()

; ── 3) Transcribir la grabacion de una llamada ya terminada ─────────────────
; MixMonitor graba la llamada entera; al colgar, el hook la manda a transcribir.
; Aqui es donde encaja un CRM: el texto va a la ficha del cliente.
exten => 102,1,Answer()
 same => n,MixMonitor(${UNIQUEID}.wav,b)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => h,1,System(/usr/local/bin/uttera-transcribir-grabacion.sh ${UNIQUEID})
