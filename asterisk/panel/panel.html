<style>
  :root{
    --bg:#eceff0; --surface:#fff; --surface-2:#f5f8f8; --ink:#14201f; --muted:#5c6c6c; --line:#d9e0e0;
    --accent:#0f7d6e; --accent-ink:#0a5a4f; --accent-soft:#d8ece8;
    --good:#1f9d57; --good-soft:#dcf1e4; --warn:#b9820f; --warn-soft:#f6ecd3;
    --bad:#c5463a; --bad-soft:#f6ded9; --neutral:#66787a; --neutral-soft:#e6ecec;
    --shadow:0 1px 2px rgba(16,40,38,.06),0 6px 20px rgba(16,40,38,.06); --radius:12px;
    color-scheme:light;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d1413; --surface:#141d1c; --surface-2:#182322; --ink:#e7efee; --muted:#94a4a3; --line:#27322f;
    --accent:#3bb8a4; --accent-ink:#8fe0d2; --accent-soft:#123a33;
    --good:#3fbf76; --good-soft:#12321f; --warn:#dda434; --warn-soft:#33280d;
    --bad:#e0685a; --bad-soft:#3a1c17; --neutral:#8fa1a0; --neutral-soft:#20302f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32); color-scheme:dark;}}
  :root[data-theme="dark"]{
    --bg:#0d1413; --surface:#141d1c; --surface-2:#182322; --ink:#e7efee; --muted:#94a4a3; --line:#27322f;
    --accent:#3bb8a4; --accent-ink:#8fe0d2; --accent-soft:#123a33;
    --good:#3fbf76; --good-soft:#12321f; --warn:#dda434; --warn-soft:#33280d;
    --bad:#e0685a; --bad-soft:#3a1c17; --neutral:#8fa1a0; --neutral-soft:#20302f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.32); color-scheme:dark;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.45; -webkit-font-smoothing:antialiased}
  h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:-.01em}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer}
  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:12px 20px;
    background:color-mix(in srgb,var(--surface) 92%,transparent); backdrop-filter:saturate(1.2) blur(8px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:10px; font-weight:600}
  .glyph{width:30px; height:30px; border-radius:8px; object-fit:cover; display:block; box-shadow:var(--shadow)}
  .brand small{display:block; color:var(--muted); font-weight:500; font-size:11.5px; letter-spacing:.02em}
  .topbar .spacer{flex:1}
  .hero-center{display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center; min-width:0; padding:0 8px}
  .hero-logo{max-height:34px; max-width:190px; object-fit:contain; display:block}
  .hero-sub{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; justify-content:center}
  .hero-company{font-weight:600; font-size:13px; color:var(--ink)}
  .hero-legend{color:var(--muted); font-size:12px; letter-spacing:.02em}
  @media (max-width:720px){ .hero-center{display:none} }
  .icon-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); width:34px; height:34px;
    border-radius:9px; display:grid; place-items:center; font-size:15px}
  .icon-btn:hover{border-color:var(--accent)}
  .wrap{padding:18px 20px 40px; max-width:1320px; margin:0 auto}
  .grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1.35fr); gap:18px; align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
  .filters{padding:14px}
  .search{display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:9px; padding:9px 12px; background:var(--surface-2)}
  .search input{border:0; background:transparent; color:var(--ink); font-size:14px; width:100%; outline:none}
  .search svg{flex:none; color:var(--muted)}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px}
  .daterange{display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap}
  .daterange input[type=date]{font-family:var(--sans); font-size:13px; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface-2); color:var(--ink)}
  .daterange .sep{color:var(--muted)}
  .chip{font-size:12.5px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted)}
  .chip[aria-pressed="true"]{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); font-weight:600}
  .chip .swatch{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle}
  .list-head{display:flex; align-items:baseline; justify-content:space-between; padding:14px 14px 8px}
  .list-head h2{font-size:14px; letter-spacing:.02em; text-transform:uppercase; color:var(--muted)}
  .list-head .count{font-size:12.5px; color:var(--muted)}
  .rows{display:flex; flex-direction:column; padding:4px; gap:2px; max-height:72vh; overflow:auto}
  .row{display:grid; grid-template-columns:auto 1fr auto; gap:11px; align-items:center; padding:10px 11px;
    border-radius:10px; border:1px solid transparent; text-align:left; width:100%; background:transparent; color:inherit}
  .row:hover{background:var(--surface-2)}
  .row[aria-selected="true"]{background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  .dir{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-size:14px; background:var(--neutral-soft); color:var(--neutral)}
  .dir.in{background:var(--accent-soft); color:var(--accent-ink)}
  .row .who{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:7px; min-width:0}
  .row .who .n{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .meta{font-size:12px; color:var(--muted); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap}
  .row .right{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px}
  .senti{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; white-space:nowrap}
  .senti.pos{background:var(--good-soft); color:var(--good)} .senti.neg{background:var(--bad-soft); color:var(--bad)}
  .senti.neu{background:var(--neutral-soft); color:var(--neutral)}
  .taglet{font-size:10.5px; color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:1px 5px}
  .disp-x{color:var(--bad)}
  .detail{position:sticky; top:86px}
  @media (max-width:900px){.detail{position:static}}
  .d-head{padding:16px 18px; border-bottom:1px solid var(--line)}
  .d-head .top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
  .d-head h1{font-size:18px}
  .d-head .sub{color:var(--muted); font-size:13px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .d-body{padding:16px 18px; display:flex; flex-direction:column; gap:16px}
  .player{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px}
  .player audio{width:100%}
  .section-t{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .section-t .hr{flex:1; height:1px; background:var(--line)}
  .intel{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .card{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px}
  .card .lab{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
  .card .big{font-size:17px; font-weight:600; margin-top:4px}
  .spk{display:flex; flex-direction:column; gap:7px; margin-top:8px}
  .spk .line{display:flex; align-items:center; gap:8px; font-size:12.5px}
  .spk .name{width:34px; color:var(--muted); font-family:var(--mono)}
  .spk .bar{flex:1; height:7px; background:var(--neutral-soft); border-radius:4px; overflow:hidden}
  .spk .bar span{display:block; height:100%; background:var(--accent); border-radius:4px}
  .spk .pct{width:44px; text-align:right; color:var(--muted); font-family:var(--mono); font-size:11.5px}
  .transcript{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; max-height:280px; overflow:auto; font-size:13.5px; line-height:1.6; white-space:pre-wrap}
  .actions{display:flex; gap:10px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 15px; border-radius:9px; font-size:13.5px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
  .btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent); border-color:transparent; color:#fff}
  .btn.primary:hover{background:var(--accent-ink)} .btn[disabled]{opacity:.55; cursor:default}
  .btn .spin{width:14px; height:14px; border-radius:50%; border:2px solid currentColor; border-top-color:transparent; animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}} @media (prefers-reduced-motion:reduce){.btn .spin{animation:none}}
  .result{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:12px}
  .result .rh{display:flex; align-items:center; gap:9px; padding:11px 13px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:13px; font-weight:600}
  .result .rb{padding:13px; font-size:13.5px; line-height:1.6; white-space:pre-wrap}
  .badge-sign{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft); border-radius:999px; padding:3px 9px}
  .muted{color:var(--muted)}
  .empty{padding:40px 18px; text-align:center; color:var(--muted); font-size:14px}
  .foot{color:var(--muted); font-size:12px; text-align:center; padding:22px 16px 6px; line-height:1.6}
  .foot a{color:var(--accent-ink); text-decoration:none}
  .foot a:hover{text-decoration:underline}
</style>
</head>

const rowsEl = $("#rows"), detailEl = $("#detail"), countEl = $("#count");
let CALLS = [], selected = null, detailCache = {};
const filters = { dir:null, senti:null, disp:null, rec:null, ext:null, txt:null, q:"" };
const jobState = {}; // id -> {sum, pdf}

const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => { s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };

// ---- intelligence helpers (formato real del conector) ----
function sentimentOf(intel){
  const s = intel && intel.sentiment;
  if(!s || !s.label) return null;
  const conf = s.confidence!=null ? " "+Number(s.confidence).toFixed(2) : "";
  const neg = ["angry","sad","fearful","disgusted"], pos = ["happy","surprised"];
  const cls = neg.includes(s.label)?"neg":pos.includes(s.label)?"pos":"neu";
  return { txt: s.label+conf, cls };
}
function profileOf(intel){
  const p = intel && intel.profile; if(!p) return null;
  // El modelo audeering entrega UN perfil por grabacion: media ponderada por
  // tiempo sobre el audio ENTERO (todos los interlocutores). NO es por hablante
  // ni de S0; tiende a quien mas habla.
  const gmap = {male:t('gender_male'), M:t('gender_male'), female:t('gender_female'), F:t('gender_female'), child:t('gender_child')};
  const g = gmap[p.gender] || null;
  const age = p.age!=null ? Math.round(p.age)+" "+t('years') : null;
  const parts = [g, age].filter(Boolean);
  return parts.length ? parts.join(" · ") : null;
}
function speakersOf(intel){
  const d = intel && intel.diarize; if(!d) return null;
  const tt = d.talktime_s || {};
  const keys = Object.keys(tt); if(!keys.length) return {n:d.num_speakers||0, rows:[]};
  const total = keys.reduce((a,k)=>a+(tt[k]||0),0) || 1;
  const rows = keys.sort().map(k => ({name:k, s:tt[k]||0, pct:Math.round(100*(tt[k]||0)/total)}));
  return { n: d.num_speakers || keys.length, rows };
}

// ---- list ----
function match(c){
  if(filters.dir && c.dir!==filters.dir) return false;
  if(filters.disp==="fail" && c.disp==="ANSWERED") return false;
  if(filters.rec==="1" && !c.has_audio) return false;
  if(filters.txt==="1" && !c.has_text) return false;
  if(filters.ext==="1" && !c.external) return false;
  if(filters.senti){ if(c._senti!==filters.senti) return false; }
  if(filters.q){
    const hay = ((c.src||"")+" "+(c.dst||"")+" "+(c.clid||"")).toLowerCase();
    if(!hay.includes(filters.q.toLowerCase())) return false;
  }
  return true;
}
// Whom the call is with: inbound = the caller (resolved name or number); outbound
// = the number dialed (dst), since the clid on outbound is the company's own name.
function whoOf(c){
  const inbound = c.dir==="in";
  if(inbound) return c.clid && /[a-zA-Z]/.test(c.clid) ? c.clid : (c.src || "—");
  return c.dst || (c.clid && /[a-zA-Z]/.test(c.clid) ? c.clid : "—");
}
function rowHTML(c){
  const inbound = c.dir==="in";
  const who = esc(whoOf(c));
  const senti = c._sentiPill;
  const failed = c.disp && c.disp!=="ANSWERED";
  return `<button class="row" data-id="${esc(c.id)}" aria-selected="${c.id===selected}">
    <span class="dir ${inbound?'in':''}" title="${inbound?t('inbound'):t('outbound')}">${inbound?'↙':'↗'}</span>
    <span style="min-width:0"><span class="who"><span class="n">${who}</span>${c.has_audio?'':' <span class="taglet">'+t('noRec')+'</span>'}</span>
      <span class="meta"><span class="mono">${esc(inbound?c.dst:c.src)}</span> · ${esc((c.start||'').replace(/^\d{4}-/,''))}</span></span>
    <span class="right">${senti||''}<span class="meta mono" style="margin:0">${failed?'<span class=disp-x>'+t('missedShort')+'</span> · ':''}${mmss(c.dur_s)}</span></span>
  </button>`;
}
function renderList(){
  const items = CALLS.filter(match);
  countEl.textContent = t('count', {n:items.length, total:CALLS.length});
  rowsEl.innerHTML = items.length ? items.map(rowHTML).join("")
    : `<div class="empty">${t('noneFilter')}</div>`;
  rowsEl.querySelectorAll(".row").forEach(r => r.addEventListener("click", () => select(r.dataset.id)));
}

async function select(id){
  selected = id; renderList();
  detailEl.innerHTML = `<div class="empty">${t('loadingCall')}</div>`;
  let d = detailCache[id];
  if(!d){
    try{ d = await (await fetch("/api/call/"+encodeURIComponent(id))).json(); detailCache[id]=d; }
    catch(e){ detailEl.innerHTML = `<div class="empty">${t('errCall')}</div>`; return; }
  }
  renderDetail(id, d);
}

function renderDetail(id, d){
  const c = CALLS.find(x=>x.id===id) || {id};
  const intel = d.intel || {};
  const sp = speakersOf(intel), prof = profileOf(intel), sent = sentimentOf(intel);
  const inbound = c.dir==="in";
  const st = jobState[id] || {};
  // Auto-generated summary (server-side, when auto_summary is on): show it as if
  // the button had already been pressed, without a second API call.
  if(!st.sum && d.summary){ st.sum = d.summary; jobState[id] = st; }
  const failed = c.disp && c.disp!=="ANSWERED";
  detailEl.innerHTML = `
    <div class="d-head">
      <div class="top"><div>
        <h1>${esc(whoOf(c))}</h1>
        <div class="sub"><span class="mono">${esc(inbound?c.dst:c.src)}</span><span>·</span>
          <span>${inbound?t('inbound'):t('outbound')}</span><span>·</span><span>${esc(c.start||'')}</span></div>
      </div>${failed?`<span class="taglet disp-x">${t('missed')}</span>`:(c._sentiPill||'')}</div>
      <div class="sub" style="margin-top:9px">
        <span class="taglet mono">id ${esc(id)}</span><span class="taglet">${mmss(c.dur_s)}</span>
        ${sp&&sp.n?`<span class="taglet">${t('speakers',{n:sp.n})}</span>`:''}${prof?`<span class="taglet">${esc(prof)}</span>`:''}
      </div>
    </div>
    <div class="d-body">
      ${d.has_audio?`<div class="player"><audio controls preload="none" src="/api/audio/${encodeURIComponent(id)}"></audio></div>`:''}
      ${(intel && (sent||sp||prof))?`<div>
        <div class="section-t">${t('intelligence')} <span class="hr"></span></div>
        <div class="intel">
          ${sent?`<div class="card"><div class="lab">${t('sentiment')}</div><div class="big" style="color:var(--${sent.cls==='pos'?'good':sent.cls==='neg'?'bad':'neutral'})">${esc(sent.txt)}</div></div>`:''}
          ${prof?`<div class="card"><div class="lab">${t('profileLabel')}</div><div class="big">${esc(prof)}</div></div>`:''}
          ${sp&&sp.rows.length?`<div class="card" style="grid-column:1/-1"><div class="lab">${t('speakerShare')}</div><div class="spk">${sp.rows.map(r=>`<div class="line"><span class="name">${esc(r.name)}</span><span class="bar"><span style="width:${r.pct}%"></span></span><span class="pct">${mmss(r.s)}</span></div>`).join("")}</div></div>`:''}
        </div></div>`:''}
      ${d.transcript?`<div><div class="section-t">${t('transcript')} <span class="hr"></span></div><div class="transcript">${esc(d.transcript)}</div></div>`
        : (failed?`<div class="muted" style="font-size:13px">${t('noAnswerText')}</div>`
                 :`<div class="muted" style="font-size:13px">${t('noTranscript')}</div>`)}
      ${d.has_audio?`<div><div class="section-t">${t('onDemand')} <span class="hr"></span></div>
        <div class="actions">
          <button class="btn" id="btnSum" ${st.sum?'disabled':''}>${st.sum?t('summaryDone'):t('genSummaryBtn')}</button>
          <button class="btn primary" id="btnPdf">📄 ${d.has_report?t('pdfView'):t('pdfSigned')}</button>
        </div>
        <div id="rz">${st.sum?summaryCard(st.sum):''}</div></div>`:''}
    </div>`;
  const b = $("#btnSum"); if(b) b.addEventListener("click", () => genSummary(id, b));
  const bp = $("#btnPdf"); if(bp) bp.addEventListener("click", () => genReport(id, bp));
}
function summaryCard(txt){
  return `<div class="result"><div class="rh">✨ ${t('summaryTitle')} <span style="flex:1"></span><span class="badge-sign">summarize · Uttera</span></div><div class="rb">${esc(txt)}</div></div>`;
}
async function genSummary(id, btn){
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${t('summarizing')}`;
  try{
    const r = await (await fetch("/api/summary/"+encodeURIComponent(id), {method:"POST"})).json();
    const txt = r.summary || r.resumen || (r.datos && (r.datos.summary||r.datos.resumen)) || r.text
              || (r.error?(t('errorPrefix')+(r.message||r.error)):JSON.stringify(r).slice(0,400));
    (jobState[id] = jobState[id]||{}).sum = txt;
    $("#rz").innerHTML = summaryCard(txt) + $("#rz").innerHTML;
    btn.disabled = false; btn.textContent = t('summaryDone'); btn.disabled = true;
  }catch(e){ btn.disabled=false; btn.textContent=t('retrySummary'); }
}

async function genReport(id, btn){
  // Abrimos la pestana YA (dentro del gesto de clic, para que no la bloquee el
  // navegador) con un aviso, y la rellenamos con el PDF cuando este listo.
  const w = window.open("", "_blank");
  if(w){ try{ w.document.write(`<!doctype html><meta charset="utf-8"><title>${t('reportTab')}</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f8f8;color:#556;display:grid;place-items:center;height:100vh}@media(prefers-color-scheme:dark){body{background:#0d1413;color:#94a4a3}}.sp{width:46px;height:46px;margin:0 auto 20px;border-radius:50%;border:4px solid #d8ece8;border-top-color:#0f7d6e;animation:r .8s linear infinite}@media(prefers-color-scheme:dark){.sp{border-color:#123a33;border-top-color:#3bb8a4}}@keyframes r{to{transform:rotate(360deg)}}.t{font-size:15px;font-weight:600}.s{font-size:12.5px;margin-top:8px;opacity:.8}.dots::after{display:inline-block;width:1em;text-align:left;content:"";animation:d 1.4s steps(4,end) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}</style><body><div style="text-align:center"><div class="sp"></div><div class="t">${t('genReportWait')}<span class="dots"></span></div><div class="s">${t('genReportSub')}</div></div></body>`); }catch(e){} }
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${t('genReportBtn')}`;
  try{
    const r = await fetch("/api/report/"+encodeURIComponent(id));
    if(!r.ok){
      let msg = t('reportFail');
      try{ const e = await r.json(); msg = t('errorPrefix')+(e.message || e.error || JSON.stringify(e).slice(0,200)); }catch(_){}
      if(w) w.close();
      $("#rz").innerHTML = `<div class="result"><div class="rh">${t('pdfSigned')}</div><div class="rb" style="color:var(--bad)">${esc(msg)}</div></div>` + $("#rz").innerHTML;
      btn.disabled=false; btn.innerHTML="\u{1F4C4} "+t('retryPdf'); return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    if(w) w.location.href = url; else window.open(url, "_blank");
    btn.disabled=false; btn.innerHTML="\u{1F4C4} "+t('pdfView');
  }catch(e){
    if(w) w.close();
    btn.disabled=false; btn.innerHTML="\u{1F4C4} "+t('retryPdf');
  }
}

const hoy = () => new Date().toLocaleDateString("sv-SE");   // YYYY-MM-DD local

async function loadCalls(){
  const s=$("#since").value, u=$("#until").value;
  const qs = new URLSearchParams({limit:"500"});
  if(s) qs.set("since", s);
  if(u) qs.set("until", u);
  countEl.textContent = t('loading');
  try{
    const r = await (await fetch("/api/calls?"+qs.toString())).json();
    CALLS = r.calls || [];
    CALLS.forEach(c => {
      c._senti = c.senti || null;
      c._sentiPill = c.senti_txt ? `<span class="senti ${c.senti}">${esc(c.senti_txt)}</span>` : "";
    });
    renderList();
    const first = CALLS.filter(match)[0];
    if(first) select(first.id);
    else detailEl.innerHTML = `<div class="empty">${t('selectCall')}</div>`;
  }catch(e){ countEl.textContent="error"; rowsEl.innerHTML=`<div class="empty">${t('errList')}</div>`; }
}
$("#since").addEventListener("change", loadCalls);
$("#until").addEventListener("change", loadCalls);

  const d = new Date(); d.setDate(d.getDate() - (dias - 1));
  return d.toLocaleDateString("sv-SE");
}
// Defaults desde /api/settings (configurables en /settings).
async function applyDefaults(){
  let d = {rec:true, ext:true, txt:false, range_days:1};
  let s = {};
  try{ s = await (await fetch("/api/settings")).json(); d = s.defaults || d; }catch(e){}
  // Centro del hero: logo del informe + nombre de empresa (la leyenda es fija)
  const rep = s.report || {};
  const hc = $("#heroCompany"); if(hc) hc.textContent = rep.company || "";
  const hl = $("#heroLogo");
  if(hl){ if(rep.has_logo){ hl.src = "/api/logo?t=" + Date.now(); hl.hidden = false; } else { hl.hidden = true; } }
  NODE = s.node || {};
  applyI18n();
  if(d.rec) markChip("rec", "1");
  if(d.ext) markChip("ext", "1");
  if(d.txt) markChip("txt", "1");
  const days = Math.max(1, d.range_days || 1);
  $("#since").value = fechaISO(days);
  $("#until").value = hoy();
  await loadCalls();
}
applyDefaults();
</script>
</body>
</html>
