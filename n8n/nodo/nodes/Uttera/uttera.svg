<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-labelledby="t">
  <title id="t">Uttera</title>
  <!-- ⚠ Lienzo CUADRADO y contenido centrado. El icono original tenia un
       viewBox de 92x56 forzado a 60x60: en los listados de n8n, que reservan
       una casilla cuadrada, eso lo dejaba descentrado y aplastado.
       El dibujo ocupa y=10..57, asi que se baja 16,5 para que su centro caiga
       en el del lienzo. -->
  <g transform="translate(0,16.5)" fill="none" stroke="#f5a623"
     stroke-width="8" stroke-linecap="round">
    <circle cx="50" cy="50" r="7" fill="#f5a623" stroke="none"/>
    <path d="M 30 50 A 20 20 0 0 1 70 50"/>
    <path d="M 10 50 A 40 40 0 0 1 90 50"/>
  </g>
</svg>
